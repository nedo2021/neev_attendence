<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Attendance Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --retro-blue: #4cb5f5;
            --retro-orange: #f07a23;
            --retro-green: #00cc00;
            --retro-green-hover: #00aa00;
            --retro-brick: #c45115;
            --retro-yellow: #ffdc00;
        }

        body {
            background-color: var(--retro-blue);
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* Disable text selection on interactive elements to feel like a game */
            user-select: none; 
        }

        /* Thick 8-bit Borders */
        .pixel-border {
            border: 4px solid black;
        }
        
        /* Modal Overlay */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
        }

        /* 8-bit Box Styles & Animations */
        .tracker-box {
            background-color: var(--retro-orange);
            color: black;
            transition: transform 0.1s, filter 0.1s, opacity 0.4s ease-out, scale 0.4s ease-out;
        }

        .tracker-box:hover {
            transform: scale(1.1) translateY(-2px);
            filter: brightness(1.1);
            z-index: 10;
        }

        .tracker-box:active {
            transform: scale(0.95);
        }

        .box-disappear {
            opacity: 0;
            scale: 0;
            pointer-events: none;
        }

        /* Inputs */
        input {
            font-family: 'Press Start 2P', cursive;
        }
        input:focus {
            outline: none;
            background-color: #f0f8ff;
        }

        /* Custom Scrollbar for records */
        .retro-scroll::-webkit-scrollbar {
            width: 12px;
            background-color: var(--retro-blue);
            border-left: 4px solid black;
        }
        .retro-scroll::-webkit-scrollbar-thumb {
            background-color: var(--retro-orange);
            border: 4px solid black;
        }

        /* Responsive Text Utilities for the font */
        .text-xxs { font-size: 0.5rem; line-height: 0.75rem; }
        .text-xs-pixel { font-size: 0.65rem; line-height: 1rem; }
    </style>
</head>
<body class="relative pb-24">

    <main class="w-full max-w-5xl mx-auto px-4 py-8 flex-grow flex flex-col items-center">
        
        <!-- Title Box -->
        <div class="bg-[var(--retro-orange)] pixel-border rounded-lg p-4 md:p-6 text-center w-full max-w-2xl shadow-[0_8px_0_rgba(0,0,0,0.2)] mb-8">
            <h1 class="text-black text-xl md:text-3xl mb-4 leading-relaxed">ATTENDANCE</h1>
            <h2 class="text-white text-sm md:text-xl leading-relaxed">TRACKER SYSTEM</h2>
        </div>

        <!-- Controls Section -->
        <div class="flex flex-col items-center gap-2 mb-10">
            <button id="view-records-btn" class="bg-[var(--retro-green)] hover:bg-[var(--retro-green-hover)] pixel-border px-6 py-3 md:px-8 md:py-4 text-black text-sm md:text-base active:translate-y-1 transition-transform cursor-pointer">
                VIEW RECORDS
            </button>
            <p class="text-[var(--retro-yellow)] text-xs-pixel mt-2 text-center" style="text-shadow: 2px 2px 0 #000;">
                click the button above to view records
            </p>
        </div>

        <div id="grid-container" class="grid grid-cols-5 md:grid-cols-9 gap-3 md:gap-4 w-full max-w-4xl mx-auto">
            <!-- Boxes will be injected here -->
        </div>

    </main>

    <footer class="fixed bottom-0 left-0 w-full z-20 pointer-events-none select-none">
        <!-- Floor Container -->
        <div class="relative w-full overflow-hidden flex flex-col" style="height: 64px;">
            <!-- Top Row of Bricks -->
            <div id="brick-row-1" class="flex w-[200%] h-1/2">
                <!-- JS will fill this -->
            </div>
            <!-- Bottom Row of Bricks (Offset) -->
            <div id="brick-row-2" class="flex w-[200%] h-1/2 -ml-8">
                <!-- JS will fill this -->
            </div>
            
            <!-- Made by tag -->
            <div class="absolute bottom-2 right-4 text-white text-[8px] md:text-[10px] tracking-widest" style="text-shadow: 1px 1px 0 #000;">
                made by neev
            </div>
        </div>
    </footer>

    <div id="input-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200 p-4">
        <div class="bg-white pixel-border rounded-md p-6 max-w-md w-full shadow-[8px_8px_0_#000] transform scale-95 transition-transform duration-200">
            
            <h3 class="text-[var(--retro-orange)] text-lg mb-6 text-center" style="text-shadow: 1px 1px 0 #000;">
                BOX #<span id="modal-box-id"></span>
            </h3>

            <div class="flex flex-col gap-4 mb-6">
                <div>
                    <label class="block text-xs-pixel mb-2 text-black">DATE:</label>
                    <input type="date" id="date-input" class="w-full pixel-border p-3 text-xs md:text-sm bg-gray-100">
                </div>
                <div>
                    <label class="block text-xs-pixel mb-2 text-black">REASON:</label>
                    <input type="text" id="reason-input" placeholder="E.G. PRESENT" class="w-full pixel-border p-3 text-xs md:text-sm bg-gray-100 uppercase" autocomplete="off">
                </div>
                <p id="error-msg" class="text-red-600 text-[10px] hidden text-center">PLEASE FILL ALL FIELDS!</p>
            </div>

            <div class="flex justify-between gap-4 mt-8">
                <button id="cancel-btn" class="bg-gray-400 hover:bg-gray-500 pixel-border px-4 py-3 text-xs w-1/2 active:translate-y-1">
                    CANCEL
                </button>
                <button id="save-btn" class="bg-[var(--retro-green)] hover:bg-[var(--retro-green-hover)] pixel-border px-4 py-3 text-xs w-1/2 active:translate-y-1">
                    SAVE
                </button>
            </div>
        </div>
    </div>

    <div id="records-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200 p-4">
        <div class="bg-[var(--retro-blue)] pixel-border rounded-md p-4 md:p-6 max-w-2xl w-full h-[80vh] flex flex-col shadow-[8px_8px_0_#000] transform scale-95 transition-transform duration-200 relative">
            
            <!-- Close Button -->
            <button id="close-records-btn" class="absolute -top-4 -right-4 bg-red-500 hover:bg-red-600 pixel-border w-10 h-10 flex items-center justify-center text-white text-xl active:translate-y-1 z-10">
                X
            </button>

            <h3 class="text-white text-center text-sm md:text-lg mb-6 pt-2" style="text-shadow: 2px 2px 0 #000;">
                ATTENDANCE LOGS
            </h3>

            <!-- Data Table/List Container -->
            <div class="flex-grow overflow-y-auto retro-scroll bg-white pixel-border p-2 md:p-4">
                <div id="records-list" class="flex flex-col gap-2">
                    <!-- Records injected here -->
                </div>
                <div id="empty-records-msg" class="text-center text-gray-500 text-xs leading-loose py-10 hidden">
                    NO DATA FOUND.<br><br>PRESS A BOX TO START.
                </div>
            </div>

            <div class="mt-6 flex justify-center">
                <button id="clear-data-btn" class="bg-[var(--retro-orange)] hover:bg-orange-600 pixel-border px-6 py-3 text-white text-xs active:translate-y-1">
                    CLEAR ALL DATA
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const gridContainer = document.getElementById('grid-container');
            const viewRecordsBtn = document.getElementById('view-records-btn');
            
            // Input Modal Elements
            const inputModal = document.getElementById('input-modal');
            const modalBoxId = document.getElementById('modal-box-id');
            const dateInput = document.getElementById('date-input');
            const reasonInput = document.getElementById('reason-input');
            const saveBtn = document.getElementById('save-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const errorMsg = document.getElementById('error-msg');
            
            // Records Modal Elements
            const recordsModal = document.getElementById('records-modal');
            const closeRecordsBtn = document.getElementById('close-records-btn');
            const clearDataBtn = document.getElementById('clear-data-btn');
            const recordsList = document.getElementById('records-list');
            const emptyRecordsMsg = document.getElementById('empty-records-msg');

            // Constants & State
            const TOTAL_BOXES = 45;
            const STORAGE_KEY = 'retroAttendanceData';
            let attendanceData = {};
            let currentActiveBox = null;

            // Generate Footer Bricks dynamically to fill screen width
            function generateBricks() {
                const row1 = document.getElementById('brick-row-1');
                const row2 = document.getElementById('brick-row-2');
                const brickCount = Math.ceil(window.innerWidth / 64) * 2 + 2; // Ensure overflow coverage
                
                const brickHTML = `<div class="bg-[var(--retro-brick)] pixel-border border-l-0 w-16 h-full flex-shrink-0"></div>`;
                
                let row1Content = '';
                let row2Content = '';
                for (let i = 0; i < brickCount; i++) {
                    row1Content += brickHTML;
                    row2Content += brickHTML;
                }
                
                row1.innerHTML = row1Content;
                row2.innerHTML = row2Content;
            }

            // Load Data from LocalStorage
            function loadData() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        attendanceData = JSON.parse(stored);
                    } catch (e) {
                        attendanceData = {};
                    }
                } else {
                    attendanceData = {};
                }
            }

            // Save Data to LocalStorage
            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(attendanceData));
            }

            // Render 45 Boxes
            function renderGrid() {
                gridContainer.innerHTML = '';
                
                for (let i = 1; i <= TOTAL_BOXES; i++) {
                    const box = document.createElement('div');
                    box.id = `box-${i}`;
                    
                    // Base styles for the box
                    box.className = 'tracker-box pixel-border rounded-sm aspect-square flex items-center justify-center text-sm md:text-xl font-bold cursor-pointer select-none';
                    box.textContent = i;
                    
                    // Check if already filled out
                    if (attendanceData[i]) {
                        box.style.display = 'none';
                    } else {
                        box.addEventListener('click', () => openInputModal(i));
                    }
                    
                    gridContainer.appendChild(box);
                }
            }

            // Modal Management
            function openInputModal(boxId) {
                currentActiveBox = boxId;
                modalBoxId.textContent = boxId;
                
                // Set default date to today
                dateInput.value = new Date().toISOString().split('T')[0];
                reasonInput.value = '';
                errorMsg.classList.add('hidden');
                
                // Show modal with animation
                inputModal.classList.remove('hidden');
                // Small delay to allow display:block to apply before opacity transition
                requestAnimationFrame(() => {
                    inputModal.classList.remove('opacity-0');
                    inputModal.querySelector('div').classList.remove('scale-95');
                });
                
                setTimeout(() => reasonInput.focus(), 100);
            }

            function closeInputModal() {
                inputModal.classList.add('opacity-0');
                inputModal.querySelector('div').classList.add('scale-95');
                
                setTimeout(() => {
                    inputModal.classList.add('hidden');
                    currentActiveBox = null;
                }, 200);
            }

            function openRecordsModal() {
                renderRecordsList();
                recordsModal.classList.remove('hidden');
                requestAnimationFrame(() => {
                    recordsModal.classList.remove('opacity-0');
                    recordsModal.querySelector('div').classList.remove('scale-95');
                });
            }

            function closeRecordsModal() {
                recordsModal.classList.add('opacity-0');
                recordsModal.querySelector('div').classList.add('scale-95');
                
                setTimeout(() => {
                    recordsModal.classList.add('hidden');
                }, 200);
            }

            // Handle Saving a Record
            function handleSave() {
                const dateVal = dateInput.value;
                const reasonVal = reasonInput.value.trim().toUpperCase();
                
                if (!dateVal || !reasonVal) {
                    errorMsg.classList.remove('hidden');
                    // Simple shake effect
                    const modalBox = inputModal.querySelector('div');
                    modalBox.style.transform = 'translateX(-10px)';
                    setTimeout(() => modalBox.style.transform = 'translateX(10px)', 50);
                    setTimeout(() => modalBox.style.transform = 'translateX(0)', 100);
                    return;
                }

                // Save data
                attendanceData[currentActiveBox] = {
                    date: dateVal,
                    reason: reasonVal,
                    timestamp: new Date().getTime()
                };
                saveData();
                closeInputModal();
                
                // Animate box disappearance
                const boxElement = document.getElementById(`box-${currentActiveBox}`);
                if (boxElement) {
                    boxElement.classList.add('box-disappear');
                    // Remove from flow after animation completes
                    setTimeout(() => {
                        boxElement.style.display = 'none';
                    }, 400);
                }
            }

            // Render Data inside Records Viewer
            function renderRecordsList() {
                recordsList.innerHTML = '';
                
                const keys = Object.keys(attendanceData).map(Number).sort((a, b) => a - b);
                
                if (keys.length === 0) {
                    emptyRecordsMsg.classList.remove('hidden');
                } else {
                    emptyRecordsMsg.classList.add('hidden');
                    
                    keys.forEach(key => {
                        const record = attendanceData[key];
                        
                        const item = document.createElement('div');
                        item.className = 'border-b-4 border-black p-3 md:p-4 flex flex-col md:flex-row md:items-center justify-between gap-2 hover:bg-gray-100';
                        
                        item.innerHTML = `
                            <div class="flex items-center gap-4">
                                <span class="bg-[var(--retro-orange)] pixel-border text-black w-8 h-8 md:w-10 md:h-10 flex items-center justify-center text-xs md:text-sm">
                                    ${key}
                                </span>
                                <span class="text-xs-pixel md:text-xs text-black">${record.date}</span>
                            </div>
                            <div class="text-xs-pixel md:text-xs text-[var(--retro-green)] break-all truncate max-w-[200px]" style="text-shadow: 1px 1px 0 #000;">
                                ${record.reason}
                            </div>
                        `;
                        recordsList.appendChild(item);
                    });
                }
            }

            // Event Listeners
            saveBtn.addEventListener('click', handleSave);
            cancelBtn.addEventListener('click', closeInputModal);
            
            viewRecordsBtn.addEventListener('click', openRecordsModal);
            closeRecordsBtn.addEventListener('click', closeRecordsModal);
            
            clearDataBtn.addEventListener('click', () => {
                // Wipe data
                attendanceData = {};
                localStorage.removeItem(STORAGE_KEY);
                
                // Re-render UI
                renderGrid();
                renderRecordsList();
                
                // Optional: Provide visual feedback
                const btnOriginalText = clearDataBtn.textContent;
                clearDataBtn.textContent = 'CLEARED!';
                clearDataBtn.classList.replace('bg-[var(--retro-orange)]', 'bg-red-500');
                
                setTimeout(() => {
                    clearDataBtn.textContent = btnOriginalText;
                    clearDataBtn.classList.replace('bg-red-500', 'bg-[var(--retro-orange)]');
                }, 1500);
            });

            // Handle 'Enter' key in inputs
            reasonInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSave();
            });

            // Close modals on overlay click
            inputModal.addEventListener('mousedown', (e) => {
                if (e.target === inputModal) closeInputModal();
            });
            recordsModal.addEventListener('mousedown', (e) => {
                if (e.target === recordsModal) closeRecordsModal();
            });

            // Initialize app
            generateBricks();
            window.addEventListener('resize', generateBricks); // Ensure bricks cover screen if resized
            loadData();
            renderGrid();
        });
    </script>
</body>
</html>
