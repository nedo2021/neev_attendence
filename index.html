<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  
  body {
    background-color: #4BB5F0; /* Retro Sky Blue */
    font-family: 'Press Start 2P', cursive;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    color: black;
  }
  
  .header { 
    text-align: center; 
    margin: 30px 10px 10px 10px; 
    font-size: 24px; 
    color: white; 
    text-shadow: 3px 3px 0 #000; 
  }
  
  .controls { 
    text-align: center; 
    padding: 20px; 
  }
  
  .container { 
    flex: 1; 
    display: flex; 
    flex-wrap: wrap; 
    justify-content: center; 
    align-content: flex-start;
    gap: 15px; 
    padding: 20px; 
    max-width: 800px;
    margin: 0 auto;
  }
  
  .box {
    width: 65px; height: 65px;
    background-color: #F07020; /* Retro Orange */
    border: 4px solid black;
    display: flex; justify-content: center; align-items: center;
    font-size: 20px; 
    cursor: pointer;
    box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
  }
  
  .box:active { 
    transform: translate(4px, 4px); 
    box-shadow: 0px 0px 0px 0px rgba(0,0,0,1); 
  }
  
  .hidden { 
    display: none !important; 
  }
  
  .btn {
    background-color: #00A800; /* Retro Green */
    border: 4px solid black;
    color: black;
    padding: 12px 16px;
    font-family: 'Press Start 2P', cursive;
    cursor: pointer;
    box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
    font-size: 12px;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  
  .btn:active { 
    transform: translate(4px, 4px); 
    box-shadow: 0px 0px 0px 0px rgba(0,0,0,1); 
  }
  
  .btn-danger { 
    background-color: #E52521; 
    color: white; 
  }
  
  .btn-edit { 
    background-color: #FFCC00; 
  }

  /* Modals */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: none; justify-content: center; align-items: center;
    z-index: 10;
  }
  
  .modal {
    background-color: #4BB5F0;
    border: 4px solid black;
    padding: 25px;
    width: 90%; max-width: 450px;
    box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
  }
  
  .modal h2 { 
    text-align: center; 
    margin-top: 0; 
    color: white;
    text-shadow: 2px 2px 0 #000;
  }
  
  .form-group { 
    margin-bottom: 20px; 
  }
  
  .form-group label { 
    display: block; 
    margin-bottom: 10px; 
    font-size: 12px; 
  }
  
  .form-group input, .form-group textarea {
    width: 100%; 
    padding: 10px; 
    box-sizing: border-box;
    border: 4px solid black; 
    font-family: 'Press Start 2P', cursive; 
    font-size: 12px;
  }
  
  .modal-actions { 
    display: flex; 
    justify-content: space-between; 
    margin-top: 25px; 
  }

  /* Records List */
  .records-container { 
    max-height: 350px; 
    overflow-y: auto; 
    margin-bottom: 20px; 
    padding-right: 10px; 
  }
  
  .record-item {
    background: #F07020; 
    border: 4px solid black; 
    padding: 15px; 
    margin-bottom: 15px;
    font-size: 10px; 
    display: flex; 
    flex-direction: column; 
    gap: 10px;
    line-height: 1.5;
  }
  
  .record-actions { 
    display: flex; 
    gap: 10px; 
    margin-top: 10px; 
  }
  
  /* Custom Scrollbar for retro feel */
  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: #4BB5F0; border-left: 4px solid black; }
  ::-webkit-scrollbar-thumb { background: #F07020; border: 4px solid black; }

  /* Brick Footer */
  .footer {
    background-color: #B83800; /* Brick color */
    background-image: 
      linear-gradient(335deg, rgba(0,0,0,0.3) 23px, transparent 23px),
      linear-gradient(155deg, rgba(0,0,0,0.3) 23px, transparent 23px),
      linear-gradient(335deg, rgba(0,0,0,0.3) 23px, transparent 23px),
      linear-gradient(155deg, rgba(0,0,0,0.3) 23px, transparent 23px);
    background-size: 58px 58px;
    border-top: 4px solid black;
    padding: 20px; 
    text-align: right; 
    font-size: 12px; 
    color: white; 
    text-shadow: 2px 2px 0 #000;
  }
</style>
</head>
<body>

<div class="header">ATTENDANCE TRACKER</div>

<div class="controls">
  <button class="btn" onclick="openRecords()">VIEW INFO</button>
</div>

<div class="container" id="grid"></div>

<div class="footer">made by neev</div>

<!-- Edit/Add Modal -->
<div class="modal-overlay" id="entryModal">
  <div class="modal">
    <h2 id="modalTitle">BOX INFO</h2>
    <input type="hidden" id="boxNumber">
    <div class="form-group">
      <label>DATE:</label>
      <input type="date" id="entryDate">
    </div>
    <div class="form-group">
      <label>REASON:</label>
      <textarea id="entryReason" rows="3" placeholder="Enter reason..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="closeModal('entryModal')">CANCEL</button>
      <button class="btn" onclick="saveEntry()">SAVE</button>
    </div>
  </div>
</div>

<!-- Records Modal -->
<div class="modal-overlay" id="recordsModal">
  <div class="modal">
    <h2>SAVED INFO</h2>
    <div class="records-container" id="recordsList"></div>
    <div class="modal-actions" style="justify-content: center;">
      <button class="btn btn-danger" onclick="closeModal('recordsModal')">CLOSE</button>
    </div>
  </div>
</div>

<script>
  const MAX_BOX = 28;
  const MIN_BOX = 1; 
  const STORAGE_KEY = 'neev_attendance_data';
  
  // Initialize the grid in descending order (28 down to 1)
  const grid = document.getElementById('grid');
  for (let i = MAX_BOX; i >= MIN_BOX; i--) {
    const box = document.createElement('div');
    box.className = 'box';
    box.id = 'box-' + i;
    box.innerText = i;
    box.onclick = () => openEntryModal(i);
    grid.appendChild(box);
  }

  // Hide boxes that are already saved
  function updateGridVisibility() {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    for (let i = MAX_BOX; i >= MIN_BOX; i--) {
      const box = document.getElementById('box-' + i);
      if (data[i]) {
        box.classList.add('hidden');
      } else {
        box.classList.remove('hidden');
      }
    }
  }

  // Open the entry/edit modal
  function openEntryModal(num) {
    document.getElementById('entryModal').style.display = 'flex';
    document.getElementById('boxNumber').value = num;
    document.getElementById('modalTitle').innerText = 'BOX ' + num + ' INFO';
    
    // Check if we are editing an existing record
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    if(data[num]) {
      document.getElementById('entryDate').value = data[num].date;
      document.getElementById('entryReason').value = data[num].reason;
    } else {
      // Default to today's date for new entries
      document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('entryReason').value = '';
    }
  }

  // Close any modal
  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  // Save the entry to LocalStorage
  function saveEntry() {
    const num = document.getElementById('boxNumber').value;
    const date = document.getElementById('entryDate').value;
    const reason = document.getElementById('entryReason').value;
    
    if(!date || !reason) {
      alert('PLEASE FILL OUT ALL FIELDS!');
      return;
    }

    const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    data[num] = { date: date, reason: reason };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    
    closeModal('entryModal');
    updateGridVisibility();
    
    // If the user was in the records view while editing, refresh it
    if(document.getElementById('recordsModal').style.display === 'flex') {
       renderRecords();
    }
  }

  // Open the list of saved records
  function openRecords() {
    document.getElementById('recordsModal').style.display = 'flex';
    renderRecords();
  }

  // Generate the HTML for the saved records in descending order
  function renderRecords() {
    const list = document.getElementById('recordsList');
    list.innerHTML = '';
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    
    let hasRecords = false;
    for (let i = MAX_BOX; i >= MIN_BOX; i--) {
      if (data[i]) {
        hasRecords = true;
        const item = document.createElement('div');
        item.className = 'record-item';
        item.innerHTML = `
          <div><strong>DAY ${i}</strong></div>
          <div>DATE: ${data[i].date}</div>
          <div>REASON: ${data[i].reason}</div>
          <div class="record-actions">
            <button class="btn btn-edit" onclick="openEntryModal(${i})">EDIT</button>
            <button class="btn btn-danger" onclick="deleteEntry(${i})">DELETE</button>
          </div>
        `;
        list.appendChild(item);
      }
    }
    
    if (!hasRecords) {
      list.innerHTML = '<div style="text-align:center; padding: 20px;">NO DATA SAVED</div>';
    }
  }

  // Delete a specific entry
  function deleteEntry(num) {
    if(confirm('ARE YOU SURE YOU WANT TO DELETE DAY ' + num + '?')) {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      delete data[num]; // Remove the record
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); // Save changes
      
      renderRecords(); // Refresh the list
      updateGridVisibility(); // Un-hide the box in the main grid
    }
  }

  // Run initial check on page load
  updateGridVisibility();
</script>
</body>
</html>
